# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: xUnit

on:
  # Build repository branches only; external pull requests must not start builds.
  push:
    branches: ['**']

jobs:
  build:
    if: github.repository == 'outfox/fennecs'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        # MinVer needs full history and tags to compute the version.
        fetch-depth: 0
        filter: tree:0
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup .NET 11 (preview)
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview
        
    - name: Restore dependencies
      run: dotnet restore fennecs.slnx
    - name: Verify formatting
      run: |
        dotnet format fennecs.slnx style --verify-no-changes --no-restore --severity warn
        dotnet format fennecs.slnx whitespace --verify-no-changes --no-restore
    - name: Build library (all target frameworks)
      run: dotnet build fennecs/fennecs.csproj -c Release
    - name: Build
      run: dotnet build --no-restore fennecs.tests/fennecs.tests.csproj
    - name: Test
      run: dotnet test --no-build --verbosity normal fennecs.tests/fennecs.tests.csproj
